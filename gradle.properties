# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.18.5
# 注意：不要随手把 loader_version 升到 0.20.x。0.20 带的 sponge-mixin 0.17.5 把
# @Redirect.at() 从单个 At 改成了 At[]，编译出来的 class 里 at 变成数组，
# 在 0.18.x（mixin 0.17.0 + MixinExtras 0.5.3）上会崩在 class_310 的 mixin 转换：
# ClassCastException: ArrayList cannot be cast to AnnotationNode
# 换 loader 版本后必须在对应启动器上实跑一次。
# Mod Properties
mod_version=1.5
maven_group=dev.g255.arc
archives_base_name=arc
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.116.17+1.21.1
# === Loom 下载源配置 ===
# 使用官方 Mojang 源（稳定但可能较慢）
loom_libraries_base=https://libraries.minecraft.net/
loom_resources_base=https://resources.download.minecraft.net/
loom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest.json
loom_experimental_versions=https://maven.fabricmc.net/net/minecraft/experimental_versions.json
loom_fabric_repository=https://repository.hanbings.io/proxy/