plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

loom {
    accessWidenerPath = file("src/main/resources/alien.accesswidener")
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_name
}

repositories {
    // Modrinth - for Sodium, MixinExtras, etc.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Satin - use local JAR bundled in META-INF/jars
    modImplementation files("META-INF/jars/satin-2.0.0.jar")

    // MixinExtras - bundled with Fabric Loader 0.15+
    // No separate dependency needed

    // Skija - bundled as JARs
    compileOnly files("META-INF/jars/skija-shared-0.116.4.jar")
    compileOnly files("META-INF/jars/skija-windows-x64-0.116.4.jar")
    compileOnly files("META-INF/jars/skija-linux-x64-0.116.4.jar")
    compileOnly files("META-INF/jars/skija-macos-arm64-0.116.4.jar")
    compileOnly files("META-INF/jars/skija-macos-x64-0.116.4.jar")
    compileOnly files("META-INF/jars/types-0.2.0.jar")
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
    // Allow Mixin AP to work with intermediary-named sources
    it.options.compilerArgs += ["-Amixin.targets.check=false"]
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}