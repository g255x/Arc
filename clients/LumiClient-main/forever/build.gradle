buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.yworks:yguard:5.0.0'
    }
}

plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/forever.accesswidener")
}

repositories {
    flatDir {
        dirs 'lib'
    }
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
    maven {
        url "https://packages.jetbrains.team/maven/p/skija/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation name: 'baritone-api-fabric-1.11.2'
    modImplementation name: 'nether-pathfinder-1.4.1'
    modImplementation name: 'IAS-Fabric-1.21.1-9.0.4'
    modImplementation name: 'satin-2.0.0'
    modImplementation name: 'sodium-fabric-0.6.13+mc1.21.1'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    include 'org.java-websocket:Java-WebSocket:1.5.3'
    include name: 'satin-2.0.0'
    include name: 'IAS-Fabric-1.21.1-9.0.4'
    include name: 'baritone-api-fabric-1.11.2'
    include name: 'sodium-fabric-0.6.13+mc1.21.1'

    implementation 'org.jetbrains.skija:skija-shared:0.93.6'
    include 'org.jetbrains.skija:skija-shared:0.93.6'
    implementation 'org.jetbrains.skija:skija-windows:0.93.6'
    include 'org.jetbrains.skija:skija-windows:0.93.6'
    implementation 'com.google.zxing:core:3.5.2'
    include 'com.google.zxing:core:3.5.2'
    implementation 'org.bytedeco:javacv:1.5.12'
    include 'org.bytedeco:javacv:1.5.12'
    implementation 'org.bytedeco:javacpp:1.5.12'
    include 'org.bytedeco:javacpp:1.5.12'
    implementation 'org.bytedeco:ffmpeg:7.1.1-1.5.12'
    include 'org.bytedeco:ffmpeg:7.1.1-1.5.12'
    runtimeOnly group: 'org.bytedeco', name: 'ffmpeg', version: '7.1.1-1.5.12', classifier: 'windows-x86_64'
    include group: 'org.bytedeco', name: 'ffmpeg', version: '7.1.1-1.5.12', classifier: 'windows-x86_64'

    implementation 'com.google.code.gson:gson:2.11.0'
    include 'com.google.code.gson:gson:2.11.0'

    implementation 'net.java.dev.jna:jna:5.17.0'
    include 'net.java.dev.jna:jna:5.17.0'

    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    include 'com.googlecode.soundlibs:jlayer:1.0.1.4'
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register('generateZkmKeepClasses') {
    def outputFile = layout.buildDirectory.file("zkm/keep-classes.txt")
    inputs.file("src/main/resources/fabric.mod.json")
    inputs.files(fileTree("src/main/resources") {
        include "*.mixins.json"
    })
    outputs.file(outputFile)

    doLast {
        def json = new groovy.json.JsonSlurper()
        def keepClasses = new LinkedHashSet<String>()
        def fabricJson = json.parse(file("src/main/resources/fabric.mod.json"))

        fabricJson.entrypoints?.each { ignored, entrypoints ->
            entrypoints.each { keepClasses.add(it as String) }
        }

        fabricJson.mixins?.each { mixinConfigName ->
            def mixinConfigFile = file("src/main/resources/${mixinConfigName}")
            if (!mixinConfigFile.exists()) {
                return
            }

            def mixinConfig = json.parse(mixinConfigFile)
            def mixinPackage = mixinConfig.package ? "${mixinConfig.package}." : ""
            ['mixins', 'client', 'server'].each { key ->
                mixinConfig[key]?.each { mixinName ->
                    keepClasses.add("${mixinPackage}${mixinName}" as String)
                }
            }
        }

        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.text = keepClasses.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${keepClasses.size()} class names to ${target}"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    // 中文 Windows 上 javac 默认用 GBK 读源码，源文件是 UTF-8 会导致中文字符串字面量乱码 / 编译失败
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    foreverLoader {
        java.srcDir 'loader/src/main/java'
        resources.srcDir 'loader/src/main/resources'
    }
}

tasks.register('compileForeverLoader') {
    group = 'forever loader'
    description = 'Compatibility lifecycle task for compiling the standalone Forever Loader source set.'
    dependsOn tasks.named('compileForeverLoaderJava')
}

tasks.register('runForeverLoader', JavaExec) {
    group = 'forever loader'
    description = 'Runs the standalone Forever Loader from source.'
    dependsOn tasks.named('foreverLoaderClasses')
    mainClass = 'dev.kissoo.loader.ForeverLoader'
    classpath = sourceSets.foreverLoader.runtimeClasspath
    workingDir = file('.')
}

tasks.register('foreverLoaderJar', Jar) {
    group = 'forever loader'
    description = 'Builds the standalone Forever Loader jar.'
    dependsOn tasks.named('foreverLoaderClasses')
    archiveFileName = 'ForeverLoader.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(sourceSets.foreverLoader.output)
    manifest {
        attributes(
                'Main-Class': 'dev.kissoo.loader.ForeverLoader',
                'Implementation-Title': 'Forever Loader',
                'Implementation-Version': '1.0.0'
        )
    }
}

tasks.register('publishForeverLoaderToWeb', Copy) {
    group = 'forever loader'
    description = 'Copies the standalone loader jar into web/api/private for website deployment.'
    dependsOn tasks.named('foreverLoaderJar')
    from(tasks.named('foreverLoaderJar').flatMap { it.archiveFile })
    into(file('web/api/private'))
    rename { 'forever-loader.jar' }
}

def foreverRootDir = file('D:/illililililililililililillil')
def foreverZkmDir = providers.gradleProperty('forever.zkm.dir')
        .orElse('D:/illililililililililililillil/25zkm')
def foreverRenameFile = providers.gradleProperty('forever.zkm.renameFile')
        .orElse('D:/illililililililililililillil/rename/10000.txt')

def zkmQuote = { File f ->
    '"' + f.absolutePath + '"'
}

def javaExecPath = {
    def javaHome = new File(System.getProperty('java.home'))
    def exe = new File(new File(javaHome, 'bin'), org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'java.exe' : 'java')
    exe.exists() ? exe.absolutePath : 'java'
}

tasks.register('generateForeverLoaderZkmScript') {
    group = 'forever loader'
    description = 'Generates a ZKM script for the standalone Forever Loader.'
    dependsOn tasks.named('foreverLoaderJar')

    def scriptFile = layout.buildDirectory.file('zkm/forever-loader-zkm.txt')
    inputs.file(tasks.named('foreverLoaderJar').flatMap { it.archiveFile })
    outputs.file(scriptFile)

    doLast {
        def inputJar = tasks.named('foreverLoaderJar').get().archiveFile.get().asFile
        def outDir = layout.buildDirectory.dir('obfuscated/loader-zkm').get().asFile
        def changeLog = layout.buildDirectory.file('zkm/ForeverLoader_ChangeLog.txt').get().asFile
        def renameFile = file(foreverRenameFile.get())
        def javaHome = new File(System.getProperty('java.home'))
        def jmodsDir = new File(javaHome, 'jmods')
        if (!jmodsDir.exists() && javaHome.parentFile != null) {
            jmodsDir = new File(javaHome.parentFile, 'jmods')
        }
        if (!jmodsDir.exists()) {
            throw new GradleException("Cannot find JDK jmods directory for ZKM classpath: ${jmodsDir}")
        }
        if (!renameFile.exists()) {
            throw new GradleException("Cannot find ZKM rename dictionary: ${renameFile}")
        }

        outDir.mkdirs()
        changeLog.parentFile.mkdirs()

        def jmods = fileTree(jmodsDir) {
            include '*.jmod'
        }.files.sort { it.name }

        def lines = []
        lines << 'classpath'
        jmods.eachWithIndex { File f, int i ->
            lines << "    ${zkmQuote(f)}${i == jmods.size() - 1 ? ';' : ''}"
        }
        lines << ''
        lines << 'open'
        lines << '    openNestedArchives=false'
        lines << "    ${zkmQuote(inputJar)};"
        lines << ''
        lines << 'exclude'
        lines << '    hoprc.obf.neko.NekoInclude and'
        lines << '    hoprc.obf.neko.NekoInclude * and'
        lines << '    hoprc.obf.neko.NekoInclude *(*) and'
        lines << '    hoprc.obf.neko.NekoExclude and'
        lines << '    hoprc.obf.neko.NekoExclude * and'
        lines << '    hoprc.obf.neko.NekoExclude *(*) and'
        lines << '    hoprc.obf.neko. and'
        lines << '    hoprc.obf.neko.**. and'
        lines << '    hoprc.obf.neko.**.* and'
        lines << '    hoprc.obf.neko.**.* * and'
        lines << '    hoprc.obf.neko.**.* *(*) and'
        lines << '    dev.kissoo.loader.ForeverLoader and'
        lines << '    dev.kissoo.loader.ForeverLoader main(java.lang.String[]);'
        lines << ''
        lines << 'obfuscateFlowExclude            hoprc.obf.neko.* ;'
        lines << 'obfuscateExceptionsExclude      hoprc.obf.neko.* ;'
        lines << 'stringEncryptionExclude         hoprc.obf.neko.* ;'
        lines << 'integerEncryptionExclude        hoprc.obf.neko.* ;'
        lines << 'longEncryptionExclude           hoprc.obf.neko.* ;'
        lines << 'obfuscateReferencesExclude      hoprc.obf.neko.* ;'
        lines << 'obfuscateReferencesExclude      hoprc.obf.neko.* * ;'
        lines << 'obfuscateReferencesExclude      hoprc.obf.neko.* *(*) ;'
        lines << ''
        lines << 'trim'
        lines << '    deleteSourceFileAttributes=true'
        lines << '    deleteDeprecatedAttributes=true'
        lines << '    deleteAnnotationAttributes=false'
        lines << '    deleteExceptionAttributes=false'
        lines << '    deleteUnknownAttributes=false;'
        lines << ''
        lines << 'obfuscate'
        lines << '    changeLogFileIn=""'
        lines << "    changeLogFileOut=${zkmQuote(changeLog)}"
        lines << '    keepGenericsInfo=false'
        lines << '    keepInnerClassInfo=false'
        lines << '    obfuscateFlow=extraAggressive'
        lines << '    exceptionObfuscation=heavy'
        lines << '    encryptStringLiterals=enhanced'
        lines << '    encryptIntegerConstants=aggressive'
        lines << '    encryptLongConstants=normal'
        lines << '    mixedCaseClassNames=true'
        lines << '    aggressiveMethodRenaming=true'
        lines << '    randomize=true'
        lines << '    localVariables=obfuscate'
        lines << '    lineNumbers=scramble'
        lines << '    autoReflectionHandling=normal'
        lines << '    obfuscateReferences=normal'
        lines << '    keepBalancedLocks=true'
        lines << '    obfuscateParameters=normal'
        lines << '    methodParameterChanges=none'
        lines << "    newClassNameFile=${zkmQuote(renameFile)}"
        lines << "    newFieldNameFile=${zkmQuote(renameFile)}"
        lines << "    newMethodNameFile=${zkmQuote(renameFile)}"
        lines << '    collapsePackagesWithDefault="PoweredbyOpus";'
        lines << ''
        lines << "saveAll archiveCompression=all ${zkmQuote(outDir)};"
        lines << ''

        def script = scriptFile.get().asFile
        script.parentFile.mkdirs()
        script.text = lines.join(System.lineSeparator())
        println "Wrote Forever Loader ZKM script: ${script}"
    }
}

tasks.register('obfuscateForeverLoaderZkm') {
    group = 'forever loader'
    description = 'Builds and obfuscates the standalone Forever Loader with ZKM.'
    dependsOn tasks.named('generateForeverLoaderZkmScript')

    def outputJar = layout.buildDirectory.file('libs/ForeverLoader-obf.jar')
    inputs.file(tasks.named('foreverLoaderJar').flatMap { it.archiveFile })
    inputs.file(layout.buildDirectory.file('zkm/forever-loader-zkm.txt'))
    outputs.file(outputJar)

    doLast {
        def zkmJar = new File(file(foreverZkmDir.get()), 'ZKM.jar')
        def script = layout.buildDirectory.file('zkm/forever-loader-zkm.txt').get().asFile
        def zkmOutputDir = layout.buildDirectory.dir('obfuscated/loader-zkm').get().asFile
        def zkmOutputJar = new File(zkmOutputDir, 'ForeverLoader.jar')
        def targetJar = outputJar.get().asFile

        if (!zkmJar.exists()) {
            throw new GradleException("Cannot find ZKM.jar: ${zkmJar}")
        }
        if (zkmOutputDir.exists()) {
            delete zkmOutputDir
        }
        zkmOutputDir.mkdirs()

        println "Running ZKM for Forever Loader..."
        def process = new ProcessBuilder(javaExecPath(), '-jar', zkmJar.absolutePath, script.absolutePath)
                .directory(zkmJar.parentFile)
                .inheritIO()
                .start()
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("ZKM failed with exit code ${exitCode}")
        }

        if (!zkmOutputJar.exists()) {
            def jars = fileTree(zkmOutputDir) {
                include '*.jar'
            }.files.sort { -it.lastModified() }
            if (jars.isEmpty()) {
                throw new GradleException("ZKM finished but no jar was produced in ${zkmOutputDir}")
            }
            zkmOutputJar = jars.first()
        }

        targetJar.parentFile.mkdirs()
        copy {
            from zkmOutputJar
            into targetJar.parentFile
            rename { targetJar.name }
        }
        println "Obfuscated Forever Loader jar: ${targetJar}"
    }
}

tasks.register('verifyObfuscatedForeverLoaderJar') {
    group = 'forever loader'
    description = 'Verifies the obfuscated Forever Loader jar has a runnable manifest.'
    dependsOn tasks.named('obfuscateForeverLoaderZkm')

    doLast {
        def jarFile = layout.buildDirectory.file('libs/ForeverLoader-obf.jar').get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Missing obfuscated loader jar: ${jarFile}")
        }
        def jar = new java.util.jar.JarFile(jarFile)
        try {
            def mainClass = jar.manifest?.mainAttributes?.getValue('Main-Class')
            if (mainClass == null || mainClass.isBlank()) {
                throw new GradleException("Missing Main-Class in ${jarFile}")
            }
            def mainEntry = mainClass.replace('.', '/') + '.class'
            if (jar.getEntry(mainEntry) == null) {
                throw new GradleException("Entry class is missing from obfuscated jar: ${mainEntry}")
            }
            println "Obfuscated loader Main-Class: ${mainClass}"
        } finally {
            jar.close()
        }
        println "Verified runnable obfuscated Forever Loader jar: ${jarFile}"
    }
}

tasks.register('publishObfuscatedForeverLoaderToWeb', Copy) {
    group = 'forever loader'
    description = 'Copies the obfuscated standalone loader jar into web/api/private for website deployment.'
    dependsOn tasks.named('verifyObfuscatedForeverLoaderJar')
