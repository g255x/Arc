def jpackageExecPath = {
    def javaHome = new File(System.getProperty('java.home'))
    def exe = new File(new File(javaHome, 'bin'), org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'jpackage.exe' : 'jpackage')
    exe.exists() ? exe.absolutePath : 'jpackage'
}

tasks.register('packageForeverLoaderExe') {
    group = 'forever loader'
    description = 'Packages the obfuscated Forever Loader as a Windows app-image with a bundled Java runtime.'
    dependsOn tasks.named('verifyObfuscatedForeverLoaderJar')

    def inputJar = layout.buildDirectory.file('libs/ForeverLoader-obf.jar')
    def imageRoot = layout.buildDirectory.dir('loader-exe')
    def stagingRoot = layout.buildDirectory.dir('loader-jpackage-input')
    inputs.file(inputJar)
    outputs.dir(imageRoot)

    doLast {
        def jarFile = inputJar.get().asFile
        def outputDir = imageRoot.get().asFile
        def stagingDir = stagingRoot.get().asFile
        if (outputDir.exists()) {
            delete outputDir
        }
        if (stagingDir.exists()) {
            delete stagingDir
        }
        outputDir.mkdirs()
        stagingDir.mkdirs()
        copy {
            from jarFile
            into stagingDir
        }

        def args = [
                jpackageExecPath(),
                '--type', 'app-image',
                '--name', 'ForeverLoader',
                '--app-version', '1.0.0',
                '--vendor', 'Forever',
                '--input', stagingDir.absolutePath,
                '--main-jar', jarFile.name,
                '--dest', outputDir.absolutePath,
                '--java-options', '-Dfile.encoding=UTF-8',
                '--java-options', '-Xmx768m'
        ]

        println "Running jpackage for Forever Loader exe image..."
        def process = new ProcessBuilder(args)
                .directory(projectDir)
                .inheritIO()
                .start()
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("jpackage failed with exit code ${exitCode}. Make sure Gradle is running on a full JDK 21, not a JRE.")
        }

        def exe = new File(outputDir, 'ForeverLoader/ForeverLoader.exe')
        if (!exe.exists()) {
            throw new GradleException("jpackage finished but exe was not found: ${exe}")
        }

        // jpackage launches the UI through its native executable but does not place
        // java/javaw launchers in the app-image. The built-in Minecraft launcher
        // needs javaw, so copy the matching JDK 21 launchers into the bundled runtime.
        def sourceBin = new File(System.getProperty('java.home'), 'bin')
        def runtimeBin = new File(outputDir, 'ForeverLoader/runtime/bin')
        ['java.exe', 'javaw.exe'].each { launcherName ->
            def sourceLauncher = new File(sourceBin, launcherName)
            if (!sourceLauncher.exists()) {
                throw new GradleException("Missing JDK launcher required by built-in Minecraft launch: ${sourceLauncher}")
            }
            copy {
                from sourceLauncher
                into runtimeBin
            }
        }
        println "Forever Loader exe image: ${exe.parentFile}"
    }
}

tasks.register('zipForeverLoaderExe', Zip) {
    group = 'forever loader'
    description = 'Zips the bundled Forever Loader exe image for website upload.'
    dependsOn tasks.named('packageForeverLoaderExe')
