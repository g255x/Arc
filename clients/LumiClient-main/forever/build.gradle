// ─── yGuard Obfuscation ────────────────────────────────────────────
def yguardOutputDir  = layout.buildDirectory.dir('obfuscated')
def yguardOutputJar  = layout.buildDirectory.file('obfuscated/Forever-obf.jar')

tasks.register('yguardObfuscate') {
    group       = 'forever'
    description = 'Obfuscate the built Forever jar with yGuard (rename only, no shrink).'
    dependsOn build

    inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    outputs.file(yguardOutputJar)

    doLast {
        def inputJar  = tasks.named('remapJar').get().archiveFile.get().asFile
        def outDir    = yguardOutputDir.get().asFile
        def outJar    = yguardOutputJar.get().asFile
        def renameLog = layout.buildDirectory.file('yguard-rename-log.xml').get().asFile

        outDir.mkdirs()
        renameLog.parentFile.mkdirs()

        ant.taskdef(
            name: 'yguard',
            classname: 'com.yworks.yguard.YGuardTask',
            classpath: buildscript.configurations.classpath.asPath
        )

        ant.yguard {
            inoutpair(in: inputJar.absolutePath, out: outJar.absolutePath)
            rename(logfile: renameLog.absolutePath, replaceClassNameStrings: 'true') {
                keep {
                    // Fabric entry point
                    'class'(name: 'nacho.Forever', methods: 'private', fields: 'private')
                    // Mixin classes — keep ALL members (@Shadow/@Inject need exact names)
                    'class'(name: 'hoprc.asm.accessors.**', methods: 'private', fields: 'private')
                    'class'(name: 'hoprc.asm.mixins.**', methods: 'private', fields: 'private')
                    'class'(name: 'hoprc.asm.mixins.sodium.**', methods: 'private', fields: 'private')
                    'class'(name: 'hoprc.asm.mixins.spearfix.**', methods: 'private', fields: 'private')
                }
            }
        }
    }
}

