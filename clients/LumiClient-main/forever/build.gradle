// ─── 防篡改：嵌入 jar SHA-256 ────────────────────────────────────
// 用法：build + inject（jar uf dev/）之后执行 ./gradlew embedSha
// 计算最终 jar（排除 sha256.txt 自身）的 SHA-256，写入 sha256.txt 嵌入 jar，
// 并存一份到 <jar>.sha256.txt。运行时 IntegrityCheck 重算比对，不一致即崩。
tasks.register('embedSha') {
    group       = 'forever'
    description = 'Compute jar SHA-256 (excluding sha256.txt) and embed it into the jar'
    doLast {
        def jarFile = file("build/libs/Forever-1.3.0.jar")
        if (!jarFile.exists()) {
            throw new GradleException("jar not found: ${jarFile} — run ./gradlew build + inject first")
        }
        def sha = computeExcludedSha(jarFile)

        // 写 sha256.txt 到临时目录，用 jar 工具加进 jar 根部
        def tmpDir = file("${buildDir}/embedSha")
        tmpDir.mkdirs()
        def shaFile = new File(tmpDir, "sha256.txt")
        shaFile.text = sha

        def jarBin = "${System.getProperty('java.home')}/bin/jar"
        def jarTool = new File(jarBin).exists() ? jarBin : 'jar'
        def pb = new ProcessBuilder(jarTool, 'uf', jarFile.absolutePath, '-C', tmpDir.absolutePath, 'sha256.txt')
        pb.redirectErrorStream(true)
        def proc = pb.start()
        proc.waitFor()
        if (proc.exitValue() != 0) {
            throw new GradleException("jar tool failed with exit " + proc.exitValue())
        }

        // side 文件便于核对
        new File(jarFile.absolutePath + ".sha256.txt").text = sha
        println ''
        println '══════════════════════════════════════════════════'
        println '  Integrity SHA embedded!'
        println "  JAR : ${jarFile.absolutePath}"
        println "  SHA : ${sha}"
        println '══════════════════════════════════════════════════'
    }
}

def computeExcludedSha(File jarFile) {
    def md = java.security.MessageDigest.getInstance('SHA-256')
    def names = []
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        zip.entries().each { e ->
            if (e.isDirectory()) return
            if (e.name == 'sha256.txt') return
            names << e.name
        }
        names.sort()
        names.each { name ->
            def entry = zip.getEntry(name)
            md.update(name.getBytes('UTF-8'))
            md.update((byte) 0)
            zip.getInputStream(entry).withCloseable { ins ->
                def buf = new byte[8192]
                int n
                while ((n = ins.read(buf)) != -1) md.update(buf, 0, n)
            }
            md.update((byte) 1)
        }
    }
    return md.digest().collect { String.format('%02x', it) }.join('')
}

