plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/lumi.accesswidener")
}

repositories {
    flatDir {
        dirs 'lib'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation name: 'baritone-api-fabric-1.21.1-1.11.2'
    modImplementation name: 'nether-pathfinder-1.4.1'
    modImplementation name: 'IAS-Fabric-1.21.1-9.0.2'
    modImplementation files('lib/satin-2.0.0.jar')
    modImplementation name: 'sodium-fabric-0.6.13+mc1.21.1'
    implementation 'org.apiguardian:apiguardian-api:1.1.2'
    include name: 'IAS-Fabric-1.21.1-9.0.2'
    include name: 'satin-2.0.0'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    options.compilerArgs << "-Xmaxerrs" << "2048"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}

// ========== 弹窗辅助闭包（始终置顶） ==========
def showAlwaysOnTopConfirm = { String message, String title = "确认" ->
    def result = false
    try {
        java.awt.EventQueue.invokeAndWait {
            def dialog = new javax.swing.JDialog()
            dialog.setTitle(title)
            dialog.setModal(true)
            dialog.setAlwaysOnTop(true)          // 🔝 强制置顶
            dialog.setResizable(false)

            def optionPane = new javax.swing.JOptionPane(
                    message,
                    javax.swing.JOptionPane.QUESTION_MESSAGE,
                    javax.swing.JOptionPane.YES_NO_OPTION
            )
            dialog.setContentPane(optionPane)
            dialog.pack()
            dialog.setLocationRelativeTo(null)   // 屏幕居中
            dialog.setDefaultCloseOperation(javax.swing.JDialog.DO_NOTHING_ON_CLOSE)

            // 监听用户点击
            optionPane.addPropertyChangeListener { evt ->
                if (evt.propertyName == javax.swing.JOptionPane.VALUE_PROPERTY) {
                    dialog.dispose()
                }
            }

            // 显示对话框（阻塞直到关闭）
            dialog.visible = true

            // 判断用户是否点击了“是”
            def value = optionPane.value
            if (value instanceof Integer && value == javax.swing.JOptionPane.YES_OPTION) {
                result = true
            } else if (value instanceof String && value == "YES") {
                result = true
            }
        }
    } catch (Exception e) {
        println "⚠️ 弹窗显示失败: ${e.message}"
        // 降级到控制台输入（仅适用于命令行）
        println "请手动输入 y 或 n："
        def input = System.console()?.readLine("> ")
        result = (input == "y" || input == "Y")
    }
    return result
}

// ================== 自动推送任务（无确认） ==================
tasks.register('updateGithub') {
    description = '自动提交并推送所有更改到 GitHub'
    group = 'publishing'

    doLast {
        def timestamp = new Date().format('yyyy-MM-dd HH:mm:ss')
        def commitMsg = "Auto update on ${timestamp}"

        // 辅助方法：执行命令并返回输出
        def runCmd = { String cmd ->
            def process = Runtime.getRuntime().exec(cmd, null, project.projectDir)
            def out = new ByteArrayOutputStream()
            def err = new ByteArrayOutputStream()
            process.waitForProcessOutput(out, err)
            return [exit: process.exitValue(), out: out.toString().trim(), err: err.toString().trim()]
        }

        // 1. 检查是否有更改
        def status = runCmd("git status --porcelain")
        if (status.exit != 0) {
            println "❌ git status 失败: ${status.err}"
            throw new GradleException("git status failed")
        }
        if (status.out.isEmpty()) {
            println "ℹ️ 没有检测到需要提交的更改，跳过推送。"
            return // 直接结束任务，不抛异常
        }

        // 2. git add .
        def addResult = runCmd("git add .")
        if (addResult.exit != 0) {
            println "❌ git add 失败: ${addResult.err}"
            throw new GradleException("git add failed")
        }

        // 3. git commit
        def commitResult = runCmd("git commit -m \"${commitMsg}\"")
        if (commitResult.exit != 0) {
            println "❌ 提交失败: ${commitResult.err}"
            throw new GradleException("git commit failed")
        }

        // 4. git push（自动设置上游跟踪）
        def pushResult = runCmd("git push -u origin main")
        if (pushResult.exit != 0) {
            println "❌ 推送失败: ${pushResult.err}"
            throw new GradleException("git push failed")
        }

        println "✅ 更新 GitHub 完成！提交信息: ${commitMsg}"
    }
}

// ================== 恢复 src 文件夹（危险操作，需置顶确认） ==================
tasks.register('restoreSrc') {
    description = '从远程强制恢复 src 文件夹（覆盖本地所有 src 下的更改）'
    group = 'publishing'

    doLast {
        // 置顶弹窗确认
        def confirmed = showAlwaysOnTopConfirm(
                "⚠️ 此操作将丢弃 src/ 目录下所有本地未提交的更改！\n\n确定要继续吗？",
                "⚠️ 确认恢复 src"
        )
        if (!confirmed) {
            println "操作已取消。"
            return
        }

        def runCmd = { String cmd ->
            def process = Runtime.getRuntime().exec(cmd, null, project.projectDir)
            def out = new ByteArrayOutputStream()
            def err = new ByteArrayOutputStream()
            process.waitForProcessOutput(out, err)
            return [exit: process.exitValue(), out: out.toString().trim(), err: err.toString().trim()]
        }

        println "📥 正在 fetch 最新代码..."
        def fetchResult = runCmd("git fetch origin")
        if (fetchResult.exit != 0) {
            println "❌ git fetch 失败: ${fetchResult.err}"
            throw new GradleException("git fetch failed")
        }

        println "🔄 正在强制恢复 src/ 目录 ..."
        def checkoutResult = runCmd("git checkout origin/main -- src/")
        if (checkoutResult.exit != 0) {
            println "❌ git checkout 失败: ${checkoutResult.err}"
            throw new GradleException("git checkout failed")
        }

        println "✅ src/ 目录已恢复为远程最新版本。"
    }
}

// ================== 全量强制覆盖（危险操作，需置顶确认） ==================
tasks.register('pullForceGithub') {
    description = '强制从 GitHub 拉取并覆盖本地所有文件（丢弃所有本地更改）'
    group = 'publishing'

    doLast {
        // 置顶弹窗确认
        def confirmed = showAlwaysOnTopConfirm(
                "⚠️ 此操作将丢弃本地所有未提交的更改，且不可恢复！\n\n确定要继续吗？",
                "⚠️ 确认强制覆盖"
        )
        if (!confirmed) {
            println "操作已取消。"
            return
        }

        def runCmd = { String cmd ->
            def process = Runtime.getRuntime().exec(cmd, null, project.projectDir)
            def out = new ByteArrayOutputStream()
            def err = new ByteArrayOutputStream()
            process.waitForProcessOutput(out, err)
            return [exit: process.exitValue(), out: out.toString().trim(), err: err.toString().trim()]
        }

        println "📥 正在 fetch 最新代码..."
        def fetchResult = runCmd("git fetch --all")
        if (fetchResult.exit != 0) {
            println "❌ git fetch 失败: ${fetchResult.err}"
            throw new GradleException("git fetch failed")
        }

        println "🔄 正在强制重置到 origin/main ..."
        def resetResult = runCmd("git reset --hard origin/main")
        if (resetResult.exit != 0) {
            println "❌ git reset 失败: ${resetResult.err}"
            throw new GradleException("git reset failed")
        }

        println "✅ 强制覆盖完成！本地代码已与远程保持一致。"
    }
}
